# SonarQube Project Configuration
sonar.projectKey=customer-payments-portal
sonar.projectName=Customer Payments Portal
sonar.projectVersion=1.0

# Source code directories
sonar.sources=server,client/src
sonar.tests=server/__tests__,client/src/__tests__

# Exclusions
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/*.test.js,**/*.spec.js,**/coverage/**

# JavaScript/TypeScript specific settings
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info,client/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Language
sonar.language=js

# Coverage exclusions
sonar.coverage.exclusions=**/*.test.js,**/*.spec.js,**/tests/**,**/__tests__/**
