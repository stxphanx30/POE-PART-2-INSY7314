version: 2.1

orbs:
  node: circleci/node@5.0.2

jobs:
  test-backend:
    docker:
      - image: cimg/node:22.20
      - image: mongo:6.0
    working_directory: ~/repo
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-server-deps-{{ checksum "server/package-lock.json" }}
      - node/install-packages:
          pkg-manager: npm
          app-dir: server
      - save_cache:
          paths:
            - server/node_modules
          key: v1-server-deps-{{ checksum "server/package-lock.json" }}
      - run:
          name: Run Backend Tests
          command: |
            cd server
            npm test
      - run:
          name: Run Security Audit
          command: |
            cd server
            npm audit --audit-level=moderate || true

  test-frontend:
    docker:
      - image: cimg/node:22.20
    working_directory: ~/repo
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-client-deps-{{ checksum "client/package-lock.json" }}
      - node/install-packages:
          pkg-manager: npm
          app-dir: client
      - save_cache:
          paths:
            - client/node_modules
          key: v1-client-deps-{{ checksum "client/package-lock.json" }}
      - run:
          name: Run Frontend Tests
          command: |
            cd client
            npm test -- --watchAll=false
      - run:
          name: Build Frontend
          command: |
            cd client
            npm run build
      - run:
          name: Run Security Audit
          command: |
            cd client
            npm audit --audit-level=moderate || true

workflows:
  version: 2
  test-and-deploy:
    jobs:
      - test-backend
      - test-frontend
