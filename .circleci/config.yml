version: 2.1

orbs:
  node: circleci/node@5.0.2
  sonarcloud: sonarsource/sonarcloud@2.0.0

jobs:
  test-backend:
    docker:
      - image: cimg/node:22.20
      - image: mongo:6.0
    working_directory: ~/repo
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-server-deps-{{ checksum "server/package-lock.json" }}
      - node/install-packages:
          pkg-manager: npm
          app-dir: server
      - save_cache:
          paths:
            - server/node_modules
          key: v1-server-deps-{{ checksum "server/package-lock.json" }}
      - run:
          name: Run Backend Tests
          command: |
            cd server
            npm test
      - run:
          name: Run Security Audit
          command: |
            cd server
            npm audit --audit-level=moderate || true

  test-frontend:
    docker:
      - image: cimg/node:22.20
