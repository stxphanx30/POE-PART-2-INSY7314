version: 2.1

orbs:
  node: circleci/node@5.0.2
  sonarcloud: sonarsource/sonarcloud@2.0.0

jobs:
  test-backend:
    docker:
      - image: cimg/node:18.0
      - image: mongo:6.0
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
          app-dir: ~/project/server
      - run:
          name: Run Backend Tests
          command: |
            cd server
            npm test
      - run:
          name: Run Security Audit
          command: |
            cd server
            npm audit --audit-level=moderate

  test-frontend:
    docker:
      - image: cimg/node:18.0
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
          app-dir: ~/project/client
      - run:
          name: Run Frontend Tests
          command: |
            cd client
            npm test -- --watchAll=false
      - run:
          name: Build Frontend
          command: |
            cd client
            npm run build
      - run:
          name: Run Security Audit
          command: |
            cd client
            npm audit --audit-level=moderate

  security-scan:
    docker:
      - image: cimg/node:18.0
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: |
            cd server && npm install
            cd ../client && npm install
      - run:
          name: Run npm audit (Software Composition Analysis)
          command: |
            echo "Running Software Composition Analysis..."
            cd server && npm audit --audit-level=high || true
            cd ../client && npm audit --audit-level=high || true
      - run:
          name: Check for known vulnerabilities
          command: |
            echo "Security scan completed"

  sonarqube-scan:
    docker:
      - image: cimg/node:18.0
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
          app-dir: ~/project/server
      - node/install-packages:
          pkg-manager: npm
          app-dir: ~/project/client
      - run:
          name: Run Tests with Coverage
          command: |
            cd server && npm test -- --coverage || true
            cd ../client && npm test -- --coverage --watchAll=false || true
      - sonarcloud/scan:
          cache_version: 1

  api-security-test:
    docker:
      - image: cimg/node:18.0
      - image: mongo:6.0
        environment:
          MONGO_INITDB_DATABASE: payments_test
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
          app-dir: ~/project/server
      - run:
          name: Test Rate Limiting
          command: |
            cd server
            echo "Testing rate limiting middleware..."
            npm test -- --testPathPattern=security || true
      - run:
          name: Test Authentication Security
          command: |
            cd server
            echo "Testing authentication security..."
            npm test -- --testPathPattern=auth || true
      - run:
          name: Test Input Validation
          command: |
            cd server
            echo "Testing input validation and sanitization..."
            npm test -- --testPathPattern=validation || true
      - run:
          name: Verify Security Headers
          command: |
            cd server
            echo "Verifying security headers (Helmet)..."
            npm test -- --testPathPattern=headers || true

workflows:
  version: 2
  test-and-deploy:
    jobs:
      - test-backend
      - test-frontend
      - security-scan
      - sonarqube-scan:
          context: sonarcloud
      - api-security-test:
          requires:
            - test-backend
