          keys:
            - v1-client-deps-{{ checksum "client/package-lock.json" }}
      - node/install-packages:
          pkg-manager: npm
          app-dir: client
      - save_cache:
          paths:
            - client/node_modules
          key: v1-client-deps-{{ checksum "client/package-lock.json" }}
      - run:
          name: Run Frontend Tests
          command: |
            cd client
            npm test -- --watchAll=false
      - run:
          name: Build Frontend
          command: |
            cd client
            npm run build
